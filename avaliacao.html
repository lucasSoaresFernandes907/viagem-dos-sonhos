<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação - Viagem dos Sonhos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="topo-site">
        <h1>🌴 Sua Avaliação 🌴</h1>
    </header>

    <main class="container-cards">
        <form class="balao-contato" action="#">
            <h2>O que você achou da experiência?</h2>
            
            <label for="nome-usuario">Seu Nome:</label>
            <input type="text" id="nome-usuario" placeholder="Digite seu nome">
            
            <label for="nota">Dê uma nota (1 a 5):</label>
            <input type="number" id="nota" min="1" max="5" placeholder="Ex: 5">

            <label for="texto-avaliacao">Escreva seu comentário:</label>
            <textarea id="texto-avaliacao" rows="4" placeholder="Conte o que achou do site e das viagens..."></textarea>
            
            <button type="submit">Enviar Feedback</button>

            <div class="navegacao">
                <a href="index.html" class="btn-proximo">↩ Voltar ao Início</a>
            </div>
        </form>
    </main>

</body>
</html>
