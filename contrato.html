<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viagem dos Sonhos</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header class="topo-site">
        <img src="195a33def6f0f77846eb7f2474d947cc.jpg" alt="Coqueiro" class="coqueiro">
        <h1>viagem dos sonhos</h1>
        <img src="195a33def6f0f77846eb7f2474d947cc.jpg" alt="Coqueiro" class="coqueiro">
    </header>

    <main class="container-cards">
        <article class="card">
            <img src="perfeita-fora-de-temporada.jpg" alt="Praia de Cabo Frio" class="imagem-card">
            <h2>Cabo Frio</h2>
            <p>Praias de areia branquinha e águas cristalinas perfeitas para relaxar.</p>
            <p class="preco">R$ 800,00</p>
        </article>


    </main>

    <footer class="rodape-container">
        
        <div class="balao-contato">
            <h3>Entre em Contato</h3>
            <input type="text" placeholder="Seu Nome">
            <input type="email" placeholder="Seu E-mail">
            <button>Enviar</button>
        </div>

        <div class="balao-datas">
            <h3>Agendar Viagem</h3>
            <div class="campos-datas">
                <label>Ida:</label>
                <input type="date">
                <label>Volta:</label>
                <input type="date">
                <div class="navegacao">
    <a href="avaliação.html" class="btn-proximo">Deixar uma Avaliação ➔</a>
</div>
            </div>
        </div>

    </footer>

</body>
</html>
